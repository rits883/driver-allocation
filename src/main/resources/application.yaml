
spring:
  application:
    name: driver-allocation

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/driver_allocation}
    username: ${DATABASE_USERNAME:driver_allocation}
    password: ${DATABASE_PASSWORD:driver_allocation}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8085

# Opt-in for local integration; allocation remains functional with Kafka offline.
allocation:
  kafka:
    enabled: ${ALLOCATION_KAFKA_ENABLED:false}
    partitions: ${ALLOCATION_KAFKA_PARTITIONS:3}
    replication-factor: ${ALLOCATION_KAFKA_REPLICATION_FACTOR:1}
    poll-ms: 1000
